<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Wax seal outer circle -->
  <circle cx="40" cy="40" r="36" fill="#8B1E22" opacity="0.95"/>
  <!-- Subtle texture rings -->
  <circle cx="40" cy="40" r="33" stroke="rgba(255,255,255,0.08)" stroke-width="0.5" fill="none"/>
  <circle cx="40" cy="40" r="30" stroke="rgba(255,255,255,0.06)" stroke-width="0.5" fill="none"/>
  <!-- Monogram ĐN in elegant italic serif -->
  <text x="40" y="47" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" font-weight="400" fill="#F8F4EC" text-anchor="middle" letter-spacing="-0.5" opacity="0.95">ĐN</text>
  <!-- Decorative fine circle inner ring -->
  <circle cx="40" cy="40" r="27" stroke="rgba(248,244,236,0.2)" stroke-width="0.6" fill="none" stroke-dasharray="2 3"/>
  <!-- Tiny champagne dot accents at cardinal points -->
  <circle cx="40" cy="13" r="1.2" fill="#B89555" opacity="0.7"/>
  <circle cx="40" cy="67" r="1.2" fill="#B89555" opacity="0.7"/>
  <circle cx="13" cy="40" r="1.2" fill="#B89555" opacity="0.7"/>
  <circle cx="67" cy="40" r="1.2" fill="#B89555" opacity="0.7"/>
</svg>
